<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Four lines converging on a vanishing point">
  <!-- Wordless by rule (Doctrine §3): no lettering in the mark. Four receding
       lines meeting at a point — the phenomenon the app is named for. The
       meaning survives grayscale: it is carried by the convergence, not hue. -->
  <rect width="512" height="512" rx="96" fill="#0B1020"/>
  <g fill="none" stroke-linecap="round" stroke-width="18">
    <path d="M56 452 L256 128" stroke="#F2A65A"/>
    <path d="M186 452 L256 128" stroke="#E0619E"/>
    <path d="M326 452 L256 128" stroke="#58C6E0"/>
    <path d="M456 452 L256 128" stroke="#8A97FF"/>
  </g>
  <circle cx="256" cy="128" r="26" fill="#EAECF5"/>
</svg>
