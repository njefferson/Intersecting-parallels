name: App walk

# A headless walk of the BUILT app, from the start screen: draw, drag a
# vanishing point, undo, nudge by keyboard, export, reload, cold-launch
# offline, and hold framerate at 2,000 edges (Doctrine §6; spec §11).
#
# This is the gate the unit tests cannot be: they prove the solver does what
# its author expected, and the author's expectation is exactly where the bug
# lives (hub LESSONS 7d). The walk drives the real page. Its first run found a
# real defect — arrow-key nudge worked exactly once, because the panel rebuilt
# the DOM under the reader's focus — which every unit test had passed over.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # npm ci, never npm install (Doctrine §16.1) — the lockfile is the pin.
      - run: npm ci

      - run: npx --no-install playwright-core install --with-deps chromium

      - run: node walk.mjs --shots

      # The screenshots are the walk's visible half: when a run fails, the
      # picture of the app at each step is what makes the failure legible.
      #
      # include-hidden-files is REQUIRED, not tidiness: `.walk-shots` starts
      # with a dot, and upload-artifact v4 silently excludes hidden paths. The
      # first run uploaded nothing and said so only in a warning — an artifact
      # that quietly never exists is worse than none, because you go looking
      # for it exactly when a run has failed. if-no-files-found: error makes
      # that failure loud from now on.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: walk-screenshots
          path: .walk-shots/
          include-hidden-files: true
          if-no-files-found: error
