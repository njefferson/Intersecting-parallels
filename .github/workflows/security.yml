name: Security

# SECURITY.md Part 1 — the layer that runs automatically, no thought required.
# Canonical copy of that baseline lives in the hub:
#   https://github.com/njefferson/noahjefferson/blob/main/SECURITY.md
#
# This repo was listed there under "Not in reach this session" — a session can
# only see the repos picked when it started (Doctrine §11), so the audit had
# never been run here at all. It was run on 2026-08-03 and found four real
# findings: every checkout persisted a git credential into .git/config on the
# runner, including the deploy job that holds a live Cloudflare token. Fixed in
# the same commit as this file.
#
# Finding them once is worth little; this is what keeps them found.
#
# WHY THE HUB IS CHECKED OUT: zizmor is pinned by version AND hash in the hub's
# .github/requirements-ci.txt, which is canonical there so every app is audited
# by the same build. `pip install zizmor` floats on whatever PyPI serves that
# morning — an unpinned binary executing beside a deploy token is exactly threat
# #2 in SECURITY.md. Copying the file here instead would fork it, and a forked
# pin is a pin that stops being updated.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
  # The supply chain moves without this repo being touched: a dependency or an
  # Action can turn malicious on a week nobody pushed. A weekly run is the
  # difference between "audited" and "was audited once".
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing here pushes, so the runner has no use for a git credential.
          # zizmor: artipacked — the finding this workflow exists because of.
          persist-credentials: false

      # The hub is public, so this needs no token. Pinned to the same SHA as the
      # checkout above by using the same action; the hub REF is main because the
      # pinned-tool file is meant to move when the pin is bumped.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: njefferson/noahjefferson
          ref: main
          path: .hub
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install zizmor (version- and hash-pinned, from the hub)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --only-binary=:all: \
            --require-hashes -r .hub/.github/requirements-ci.txt

      # --strict-collection is REQUIRED and is not the default. Without it a
      # workflow with a YAML error is logged at WARN, skipped, and the run still
      # exits 0 printing "No findings to report. Good job!" — so the file most
      # likely to be wrong is the one that never gets audited (hub LESSONS §25).
      - name: Workflow security audit
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --strict-collection \
            .github/workflows/

      - name: npm hygiene (the half zizmor does not cover)
        run: node .hub/pin-check.mjs --repo .

      - name: No grids in anything Noah reads
        run: node .hub/docs-check.mjs .

      # Known-vulnerable trees do not ship. This repo's npm is dev tooling only,
      # but a compromised dev dependency runs on this runner like any other.
      - name: npm audit
        run: npm audit --audit-level=moderate
