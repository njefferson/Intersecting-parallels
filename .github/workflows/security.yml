name: Security

# SECURITY.md Part 1 — the layer that runs automatically, no thought required.
# Canonical copy of that baseline lives in the hub:
#   https://github.com/njefferson/noahjefferson/blob/main/SECURITY.md
#
# This repo was listed there under "Not in reach this session" — a session can
# only see the repos picked when it started (Doctrine §11), so the audit had
# never been run here at all. It was run on 2026-08-03 and found four real
# findings: every checkout persisted a git credential into .git/config on the
# runner, including the deploy job that holds a live Cloudflare token. Fixed in
# the same commit as this file.
#
# Finding them once is worth little; this is what keeps them found.
#
# THE HUB'S GATES ARE CALLED NOW, NOT COPIED. zizmor is pinned by version AND
# hash in the hub's .github/requirements-ci.txt, and the gates are the hub's
# files, so this used to check the hub out and run eight steps against it. It
# calls the hub's reusable workflow instead: one pin, and a gate added in the
# hub arrives here on the next bump instead of when somebody remembers.
#
# THE PIN IS A COMMIT, AND THAT IS THE CHANGE THAT MATTERS MOST HERE. This
# workflow used to check the hub out at `ref: main` — a moving reference, in the
# file whose entire subject is that `pip install zizmor` floating on whatever
# PyPI serves that morning is threat #2. The same argument was being made and
# not applied to the checkout making it.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
  # The supply chain moves without this repo being touched: a dependency or an
  # Action can turn malicious on a week nobody pushed. A weekly run is the
  # difference between "audited" and "was audited once".
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-gates:
    uses: njefferson/noahjefferson/.github/workflows/hub-gates.yml@4cd365e5cb422e6136cca6741c9d2cf09fa7d11f
    with:
      pwa: true
      zizmor: true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing here pushes, so the runner has no use for a git credential.
          # zizmor: artipacked — the finding this workflow exists because of.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # Known-vulnerable trees do not ship. This repo's npm is dev tooling only,
      # but a compromised dev dependency runs on this runner like any other.
      - name: npm audit
        run: npm audit --audit-level=moderate
