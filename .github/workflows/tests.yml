name: Solver tests

# Build-order step 1's gate (spec §10.1): the solver's unit tests plus the
# machine-verifiable amendment tests (D3 continuity, D4 degeneracy) and
# acceptance tests 1 and 2 driven against the solver.
#
# CI runs `npm test` — the SAME entry point a session runs locally, because a
# gate that exists in two spellings drifts, and the copy that drifts is the one
# typed from memory (hub LESSONS 7b and the Quietkeep banned-vocabulary run).

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # npm ci, never npm install (Doctrine §16.1) — the lockfile is the pin.
      - run: npm ci

      - run: npm test
      # §7d — the notes on screen are generated from CHANGELOG.md. This fails if
      # the committed file has fallen behind, which is what makes "one source"
      # a rule rather than an intention.
      - run: npm run notes:check
